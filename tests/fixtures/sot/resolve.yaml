# Entity-resolution model for the synthetic pilot. m/u are fixed Fellegi-Sunter parameters (no training run):
# deterministic, reviewable, and pinned by the regression test.
entities:
  customer:
    prior: 0.001
    blocking: [[postcode], [phone], [vat_id]]
    comparisons:
      - {attribute: vat_id, method: exact, m: [0.9, 0.1], u: [0.0001, 0.9999]}
      - {attribute: legal_name, method: jaro_winkler, thresholds: [0.92], m: [0.7, 0.2, 0.1], u: [0.001, 0.01, 0.989]}
      - {attribute: phone, method: exact, m: [0.8, 0.2], u: [0.001, 0.999]}
      - {attribute: postcode, method: exact, m: [0.9, 0.1], u: [0.02, 0.98]}
