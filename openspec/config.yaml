schema: spec-driven

context: |
  Project: MarieKondoFürAgenten ("KonMari-Kit"), open-source software published by the
  KI Klub Werder e.V. GitHub organization (non-profit association, community maintained).
  A toolkit plus repeatable method that makes ONE pilot use case's organizational data agent-ready
  (KonMari for data: commit, imagine the ideal, discard first, tidy by category, sensible order,
  "does it spark joy for agents?" test). Source brief: research/00-quelle.md.
  Users: any organization (SMEs, associations, public bodies, esp. German/EU) running it themselves,
  or volunteers/consultants helping them; their data owners, domain experts and compliance
  (DSGVO / EU AI Act apply). No vendor lock-in, no proprietary dependencies, self-hostable,
  documentation that non-experts can follow, contributions via GitHub issues/PRs.
  Default stack (open source, self-hostable, overridable per change design): Python 3.12 CLI
  `konmari`, Postgres as the readiness catalog (DuckDB allowed for local runs), connectors for
  SharePoint/M365, CRMs, file shares and SQL warehouses, MCP servers as the agent interface,
  OpenLineage-style lineage events. Every pipeline step writes auditable decisions to the catalog.
  Defaults for open ROADMAP questions (2026-10-24, revisit after first pilot):
  identity = generic OIDC (Keycloak/Authentik reference, RFC 8693 token exchange; Entra ID via the
  same OIDC interface); judge/embedding models = self-hosted by default behind a provider interface
  (hosted API with DPA allowed via config), multilingual embedding model configurable; v1 CRM
  connectors = CSV import plus one generic REST adapter; MIP labels only inform the sensitivity tier;
  review = CLI only in v1; c05 conflict tickets = CSV export plus GitHub issues adapter;
  pseudonymisation keeps only the HMAC key (no reverse lookup table).
  Change order follows the KonMari sequence: 01 pilot charter → 09 evaluation & monitoring.

