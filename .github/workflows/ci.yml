name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # trust auth: the kit refuses SQL locators with embedded passwords
        env: {POSTGRES_USER: konmari, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      KONMARI_TEST_PG_URL: postgresql://konmari@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: npx -y @fission-ai/openspec@1.6.0 validate --all --strict
