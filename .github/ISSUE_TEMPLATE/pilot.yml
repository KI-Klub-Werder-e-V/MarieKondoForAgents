name: Pilot report
description: You tried the kit on a real use case. Tell us how it went, including failures.
labels: [pilot-report]
body:
  - type: markdown
    attributes:
      value: "Failed pilots are just as useful. No real personal data, no trade secrets. English or German is fine."
  - type: input
    id: usecase
    attributes: {label: "Use case", placeholder: "FAQ assistant for the club office"}
    validations: {required: true}
  - type: input
    id: systems
    attributes: {label: "Source systems", placeholder: "SharePoint, CRM CSV export, file share"}
  - type: dropdown
    id: reached
    attributes:
      label: "Furthest step reached"
      options: [1 charter, 2 inventory, 3 score, 4 discard, 5 normalize, 6 enrich, 7 govern, 8 connect, 9 eval]
    validations: {required: true}
  - type: textarea
    id: stuck
    attributes: {label: "Where did it get stuck?"}
    validations: {required: true}
  - type: textarea
    id: thresholds
    attributes: {label: "Thresholds you changed", description: "e.g. duplicate threshold, freshness window, golden set size"}
