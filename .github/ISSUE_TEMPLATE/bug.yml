name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste real personal or confidential data. Report vulnerabilities via SECURITY.md. English or German is fine."
  - type: input
    id: command
    attributes: {label: "Command", placeholder: "uv run konmari discard execute --as ben"}
    validations: {required: true}
  - type: textarea
    id: what
    attributes: {label: "What happened, what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: output
    attributes: {label: "Output", render: shell}
  - type: input
    id: env
    attributes: {label: "Environment", placeholder: "version/commit, OS, DuckDB or Postgres"}
