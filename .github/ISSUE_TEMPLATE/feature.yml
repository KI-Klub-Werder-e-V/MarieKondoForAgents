name: Feature request
description: New capability or connector.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes: {label: "What problem does it solve?"}
    validations: {required: true}
  - type: dropdown
    id: step
    attributes:
      label: "Step"
      options: [1 charter, 2 inventory, 3 score, 4 discard, 5 normalize, 6 enrich, 7 govern, 8 connect, 9 eval, cross-cutting]
  - type: textarea
    id: idea
    attributes: {label: "Proposal", description: "Larger changes become an OpenSpec change."}
