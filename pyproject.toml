[project]
name = "konmari"
version = "0.1.0"
description = "KonMari-Kit: make one pilot use case's organizational data agent-ready"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "KI Klub Werder e.V.", email = "admin@ki-klub-werder.de" }]
keywords = ["ai-agents", "agent-ready-data", "data-quality", "data-governance", "mcp", "rag", "gdpr", "konmari"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "datacontract-cli==1.2.7",
    "datasketch==2.0.0",
    "duckdb==2.0.0",
    "jsonschema==4.26.0",
    "langchain-text-splitters==1.1.3",
    "mcp==2.3.0",
    "openlineage-python==1.54.0",
    "opentelemetry-api==1.45.1",
    "pdfplumber==0.11.10",
    "phonenumbers==9.0.41",
    "pint==0.25.3",
    "presidio-analyzer==2.2.364",
    "pyjwt[crypto]==2.15.1",
    "python-stdnum==2.2",
    "PyYAML==6.0.3",
    "rdflib==7.6.0",
    "splink==5.0.0",
    "sqlalchemy==2.1.6",
    "tokenizers==0.23.2",
    "ucumvert==0.3.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
smb = ["smbprotocol==1.15.0"]
semantic = ["sentence-transformers==6.2.0"]
s3 = ["boto3==1.43.118"]
docling = ["docling==2.135.0"]
unstructured = ["unstructured==0.27.10"]
ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]  # ragas 0.4.3 imports a module removed in langchain-community 0.4

[project.urls]
Homepage = "https://github.com/KI-Klub-Werder-e-V/MarieKondoFuerAgenten"
Issues = "https://github.com/KI-Klub-Werder-e-V/MarieKondoFuerAgenten/issues"
Changelog = "https://github.com/KI-Klub-Werder-e-V/MarieKondoFuerAgenten/blob/main/CHANGELOG.md"

[project.scripts]
konmari = "konmari.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "psycopg[binary]==3.3.6",
    "boto3==1.43.118",
    "opentelemetry-sdk==1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konmari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a Postgres server (local cluster or KONMARI_TEST_PG_URL)"]
