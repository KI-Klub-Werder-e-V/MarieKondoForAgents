[project]
name = "konmari"
version = "0.1.0"
description = "KonMari-Kit: make one pilot use case's organizational data agent-ready"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==2.0.0",
    "jsonschema==4.26.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]

[project.scripts]
konmari = "konmari.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "psycopg[binary]==3.3.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konmari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a Postgres server (local cluster or KONMARI_TEST_PG_URL)"]
