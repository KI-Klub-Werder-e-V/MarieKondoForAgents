[project]
name = "konmari"
version = "0.1.0"
description = "KonMari-Kit: make one pilot use case's organizational data agent-ready"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "datasketch==2.0.0",
    "duckdb==2.0.0",
    "jsonschema==4.26.0",
    "openlineage-python==1.54.0",
    "phonenumbers==9.0.41",
    "pint==0.25.3",
    "presidio-analyzer==2.2.364",
    "python-stdnum==2.2",
    "PyYAML==6.0.3",
    "splink==5.0.0",
    "sqlalchemy==2.1.6",
    "ucumvert==0.3.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.3.6"]
smb = ["smbprotocol==1.15.0"]
semantic = ["sentence-transformers==6.2.0"]
s3 = ["boto3==1.43.118"]

[project.scripts]
konmari = "konmari.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "psycopg[binary]==3.3.6", "boto3==1.43.118"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/konmari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a Postgres server (local cluster or KONMARI_TEST_PG_URL)"]
