# KonMari-Kit Pilot-Charta (Kurzvorlage): Rhythmus und RACI sind vorbelegt.
# Jeden Platzhalter <FILL ...> ersetzen, dann ausführen: konmari charter validate
charter_id: mein-pilot
use_cases:
  - name: <FILL Name des Anwendungsfalls>
    purpose: <FILL wobei der Agent hilft>
    deployment_setting: {agent_users: [<FILL Nutzer des Agenten>], access: read_only}
    in_scope: [<FILL Aufgabe im Umfang>]
    out_of_scope: [<FILL ausgeschlossene Aufgabe>]
    misuse_cases: [<FILL Missbrauchsfall>]
stakeholders:
  - {id: sponsor, name: <FILL Name>, contact: <FILL Kontakt>, org_unit: <FILL Bereich>, roles: [sponsor]}
  - {id: owner, name: <FILL Name>, contact: <FILL Kontakt>, org_unit: <FILL Bereich>, roles: [use_case_owner, data_owner]}
  - {id: dpo, name: <FILL Name>, contact: <FILL Kontakt>, org_unit: <FILL Bereich>, roles: [compliance]}
  - {id: user, name: <FILL Name>, contact: <FILL Kontakt>, org_unit: <FILL Bereich>, roles: [agent_user, data_steward]}
raci:
  charter_approval:           {A: [sponsor], R: [owner]}
  metric_approval:            {A: [owner], R: [user]}
  source_inclusion:           {A: [owner], R: [owner], C: [dpo]}
  retention_discard_approval: {A: [owner], R: [user], C: [dpo]}
  sot_conflict_resolution:    {A: [owner], R: [user]}
  dpia_decision:              {A: [dpo], R: [dpo]}
  go_live_approval:           {A: [sponsor], R: [owner], C: [dpo]}
compliance:
  purpose_of_processing: <FILL Zweck der Verarbeitung>
  personal_data_categories: none
  special_categories_expected: false
  dpia_screening: {result: pending, reason: <FILL Begründung (mind. 20 Zeichen)>, decided_by: dpo}
  ai_act: {classification: pending, reason: <FILL Begründung (mind. 20 Zeichen)>}
  ai_literacy_briefing: {status: planned, date: "2026-01-15"}
cadence:
  kickoff: "2026-01-12"
  working_session_interval_days: 7
  steering: {interval_days: 14, attendees: [sponsor, dpo]}
  phase_gate_review: {after_each_step: true}
  pilot_close: "2026-06-30"
  post_pilot_review: {interval_days: 90, owner: owner}
data_scope:
  sources:
    - {id: <FILL Quellen-ID>, connector: fileshare, locator: <FILL Pfad oder URL>}
  categories:
    - {id: kb-and-sops, approver: owner, reviewers: [user]}
